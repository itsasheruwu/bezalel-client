plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.46'
}

version = '1.0.0'
group = 'org.bezalel.generated'
def modId = providers.gradleProperty('bezalelModId').get()
def smokeModDir = layout.buildDirectory.dir('bezalel-smoke-mod')
def stageSmokeMod = tasks.register('stageSmokeMod', Sync) {
    from sourceSets.main.output
    into smokeModDir
}
// Forge also scans the runtime classpath directly for mod metadata on the server.
sourceSets.main.runtimeClasspath = files(smokeModDir) + configurations.runtimeClasspath

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

minecraft {
    mappings channel: 'official', version: '1.21.1'
    // Forge 52 uses official mappings in production.
    reobf = false
    runs {
        configureEach {
            jvmArg '-Xmx1200m'
            // Forge's dedicated server needs the classes and mod metadata in one mod root.
            environment 'MOD_CLASSES', "${modId}%%${smokeModDir.get().asFile.absolutePath}"
            mods {
                "${modId}" {
                    source sourceSets.main
                }
            }
        }
        client {
            workingDirectory project.file('run-client')
        }
        server {
            workingDirectory project.file('run-server')
            arg '--nogui'
        }
    }
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn stageSmokeMod
}

tasks.matching { it.name == 'downloadMCMeta' }.configureEach {
    // The prepared image supplies the exact version metadata for offline runs.
    onlyIf { !gradle.startParameter.offline }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar') {
    archiveFileName = 'mod.jar'
}
