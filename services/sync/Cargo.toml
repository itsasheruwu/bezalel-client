[package]
name = "bezalel-sync-service"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
base64 = "0.22"
bezalel-pack-sync = { path = "../../crates/pack-sync", default-features = false }
getrandom = "0.3"
hex = "0.4"
object_store = { version = "0.12", features = ["aws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "json"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "4.6", default-features = false }
