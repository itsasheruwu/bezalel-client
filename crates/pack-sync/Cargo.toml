[package]
name = "bezalel-pack-sync"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["client"]
client = ["dep:reqwest", "dep:zip"]

[dependencies]
hex = "0.4"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "4.6", optional = true, default-features = false }
